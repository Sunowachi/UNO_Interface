# ==================== Connection ====================
server.port=8181

server.maxBodySize=65536

# ==================== Pool ====================
db.poolSize=50
db.borrowTimeoutMs=5000

# ==================== Audit ====================
audit.file=audit.log
audit.maxSize=10485760          # 10 MB
audit.maxBackups=5
audit.queueCapacity=10000

# ==================== DataStore ====================
datastore.cachePoints=200
datastore.sensorTtlMs=60000
datastore.minPostIntervalMs=200
datastore.maxSensorFields=100
datastore.maxNewMetricsPerPost=50
datastore.maxActiveSensors=20000
datastore.dbBatchSize=500
datastore.dbQueueLimit=2000000

# ==================== HTTP ====================
http.maxJsonSize=4096
http.maxConfigSize=10485760       # 10 MB