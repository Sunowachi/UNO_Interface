<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель мониторинга</title>
    <link rel="stylesheet" href="css/panel.css">
</head>

<body>
<!-- Основное приложение (скрыто до авторизации) -->
<div id="appRoot" hidden>
    <div id="mainLayout">
        <div class="top-bar">
            <div class="title-group">
                <h1>Показания датчиков</h1>
                <button id="logoutBtn" class="btn btn-secondary logout-btn" title="Выйти из аккаунта" hidden>Выйти</button>
            </div>

        </div>
        <p id="timer"><b>Время работы:</b> 0 сек</p>

        <div class="row">
            <!-- Область графиков -->
            <div class="charts-area">

                <div id="timeRangeControls" class="time-range-controls">
                    <label>
                        Дни
                        <input id="timeDays" type="number" min="0" class="time-input">
                    </label>
                    <label>
                        Часы
                        <input id="timeHours" type="number" min="0" class="time-input">
                    </label>
                    <label>
                        Минуты
                        <input id="timeMinutes" type="number" min="0" class="time-input">
                    </label>
                    <button id="applyTimeRangeBtn" class="btn">Применить</button>
                </div>

                <div id="chartsContainer" class="charts-container"></div>
            </div>

            <!-- Панель управления датчиками -->
            <div class="card" id="sensorPanel">
                <div class="panel-header">
                    <h3>Датчики</h3>
                </div>
                <div class="sensor-list-container">
                    <ul id="sensorList" class="sensor-list"></ul>
                </div>
                <div class="panel-footer" id="sensorPanelFooter"></div>
            </div>
        </div>
        <!-- Панель глобальной тревоги -->
        <div id="redAlertBar" class="red-alert-bar" hidden>
            <span class="alert-icon">🔥</span>
            <span class="alert-message"></span>
        </div>
    </div>
</div>

<!-- Модальные окна -->
<div id="editModalBackdrop" class="modal-backdrop" autocomplete="off">
    <div class="modal">
        <h3>Редактирование датчика</h3>
        <div class="modal-content-scroll">
            <label>
                ID датчика:<br>
                <input id="sensorId" class="input-full">
            </label>
            <br><br>
            <label>
                Название датчика:<br>
                <input id="sensorName" class="input-full">
            </label>
            <br><br>
            <label>
                Переменные (через запятую):<br>
                <input id="sensorVars" class="input-full">
            </label>
            <div id="varSettingsBlock" class="margin-top">
                <h4>Настройки переменных</h4>
                <div id="varSettingsContainer" class="var-settings-container"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="deleteSensorBtn" class="btn btn-danger margin-right-auto">Удалить</button>
            <button id="cancelSensorBtn" class="btn">Отмена</button>
            <button id="saveSensorBtn" class="btn btn-primary">Сохранить</button>
        </div>
    </div>
    <!-- Панель списка устройств -->
    <div id="devicePanel" class="device-panel">
        <h3>Список подключенных устройств</h3>
        <ul id="deviceList" class="list-reset"></ul>
    </div>
</div>

<div id="cancelConfirmBackdrop" class="modal-backdrop">
    <div class="modal">
        <h3>Отменить изменения?</h3>
        <p>Изменения не будут сохранены.</p>
        <div class="modal-footer">
            <button id="cancelConfirmBackBtn" class="btn">Вернуться</button>
            <button id="cancelConfirmOkBtn" class="btn btn-danger">Подтвердить</button>
        </div>
    </div>
</div>

<div id="exportModalBackdrop" class="modal-backdrop">
    <div class="modal modal-export">
        <h3>Экспорт данных</h3>
        <div class="modal-content-scroll">
            <label>
                Тип экспорта:
                <select id="exportType" class="input-full">
                    <option value="1999">COMTRADE 1999 (ZIP)</option>
                    <option value="2013" selected>COMTRADE 2013 (CFF)</option>
                </select>
            </label>

            <div class="export-time-range">
                <label>
                    От:
                    <input type="datetime-local" id="exportFrom" class="input-full">
                </label>
                <label>
                    До:
                    <input type="datetime-local" id="exportTo" class="input-full">
                </label>
            </div>

            <!-- Контейнер для динамических строк (будет заполняться через JS) -->
            <div id="exportVariablesContainer"></div>

            <!-- Кнопки управления строками -->
            <div class="export-buttons-row">
                <button id="populateFromDevicesBtn" class="btn btn-small btn-secondary" type="button">📋 Загрузить из устройств</button>
                <button id="addExportVarRow" class="btn btn-small btn-secondary" type="button">➕ Добавить датчик/переменную</button>
            </div>
        </div>
        <div class="modal-footer">
            <button id="cancelExportBtn" class="btn">Отмена</button>
            <button id="downloadExportBtn" class="btn btn-primary">Скачать</button>
        </div>
        <!-- Модальное окно выбора датчиков для экспорта -->
        <div id="exportSelectorBackdrop" class="modal-backdrop">
            <div class="modal modal-selector">
                <h3>Выберите данные для экспорта</h3>
                <div class="modal-content-scroll">
                    <div id="exportSelectorList" class="selector-list"></div>
                </div>
                <div class="modal-footer">
                    <button id="cancelSelectorBtn" class="btn">Отмена</button>
                    <button id="addSelectedBtn" class="btn btn-primary">Добавить выбранные</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Окно авторизации -->
<div id="loginModal" class="login-backdrop">
    <div class="login-box">
        <h2>Вход</h2>
        <input id="loginUser" placeholder="Логин">
        <input id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password">
        <button id="loginBtn" type="button" class="btn btn-primary btn-full">Войти</button>
        <div id="loginError"></div>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
